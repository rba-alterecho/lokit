# Testes de ponta a ponta. Separados do ci.yml porque demoram mais e porque
# instalam um navegador; nao vale a pena atrasar o deploy por causa disso.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Correr
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
